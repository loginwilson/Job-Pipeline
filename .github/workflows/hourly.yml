name: hourly pipeline

on:
  schedule:
    # four slots an hour, off the top of the hour. GitHub often delays or skips
    # scheduled runs (overnight it ran ~every 4 hours with two slots); more slots,
    # more chances. Runs never overlap (concurrency group below).
    # (Free for public repos; a private repo would count these against its minutes.)
    - cron: "7 * * * *"
    - cron: "17 * * * *"
    - cron: "32 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:           # "Run workflow" button for manual runs
    inputs:
      check_all:
        description: "Check every source and board now, ignoring their daily / 6-hour schedules"
        type: boolean
        default: false

concurrency:
  group: pipeline              # never two runs at once (they share the database)
  cancel-in-progress: false

permissions:
  contents: read
  actions: write               # lets a finished run start the next one (see the last step)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50          # a full check-everything run takes ~30 min
    steps:
      - name: Note start time
        run: echo "RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # data/pipeline.db carries first-seen dates, closed postings and the run
      # history between runs. Each run restores the newest copy and saves a new one.
      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: data/pipeline.db
          key: pipeline-db-${{ github.run_id }}
          restore-keys: pipeline-db-

      - name: Run pipeline
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
          MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOBSPIPE_API_KEY: ${{ secrets.JOBS_PIPE_KEY || secrets.JOBSPIPE_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          CORESIGNAL_API_KEY: ${{ secrets.CORESIGNAL_API_KEY || secrets.CORESIGNAL_KEY || secrets.CORE_SIGNAL_API_KEY || secrets.CORE_SIGNAL_KEY || secrets.CORESIGNAL || secrets.CORESIGNAL_API }}
          ALERTS_IMAP_USER: ${{ secrets.ALERTS_IMAP_USER }}
          ALERTS_IMAP_APP_PASSWORD: ${{ secrets.ALERTS_IMAP_APP_PASSWORD }}
          PIPELINE_CHECK_ALL: ${{ inputs.check_all && '1' || '0' }}
        run: python -m src.run

      - name: Export unscored postings for review
        if: always()
        run: python -m src.dump_review || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-dump
          path: |
            review_dump.json
            boards.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/pipeline.db
          key: pipeline-db-${{ github.run_id }}

      # Nov 10: GitHub skips most scheduled slots (7 runs in 13 hours overnight). Each run now
      # starts the next one itself, about 15 minutes after it began; the schedule above only
      # restarts the chain if it ever stops. A queued run replaces any other queued one, so
      # chains never pile up.
      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          wait=$(( 900 - ($(date +%s) - RUN_STARTED) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          gh workflow run hourly.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
