# Where postings come from, besides the company boards in watchlist.yaml.
# These are settings, not rules — criteria.yaml still decides what you see.

muse:                       # The Muse public API (free key: GitHub secret MUSE_API_KEY)
  # anonymous requests are blocked since Nov 8 (Cloudflare), so it runs only with your key
  enabled: false            # Nov 9: skipped - its API sits behind a Cloudflare bot check
  needs_key: true
  levels: [Entry Level]     # Muse's own level filter; criteria rules still apply after
  every_hours: 20           # full sweep about once a day (results can't be sorted by date)
  max_pages: 120
  max_age_days: 30          # skip postings published longer ago than this (stale listings)

discovery:                  # companies found by search → their own job board joins the hourly watch
  enabled: true
  max_new_companies_per_run: 40
  retry_unfound_after_days: 30

serpapi:                    # SerpApi Google Jobs (free monthly allowance; key: SERPAPI_API_KEY)
  enabled: true
  requests_per_day: 5       # ~150 a month; raise to match your plan's monthly allowance / 30
  pace_through_day: true    # Nov 9: spread the day's searches over 24h (fresh postings all day)
  focus:
    - {keywords: "business operations OR strategy and operations OR bizops", city: "New York, New York, United States"}
    - {keywords: "deployment strategist OR implementation specialist OR AI operations", city: "New York, New York, United States"}
    - {keywords: "chief of staff OR founders associate OR founder's associate", city: "New York, New York, United States"}
  keywords:
    - business operations OR strategy associate
    - deployment strategist OR chief of staff OR founders associate
  cities: ["San Francisco, California, United States", "Chicago, Illinois, United States", "Miami, Florida, United States",
           "Los Angeles, California, United States", "Austin, Texas, United States"]

jobspipe:                   # JobsPipe ONE-TIME sweep (free 1,000 credits, never renew; key: JOBSPIPE_API_KEY)
  enabled: true
  total_credits: 950        # stops here; 1 credit = 1 job, 25 per page on the free plan
  filters:                  # applied to every search
    job_title_not: [senior, sr., director, head of, vp, vice president, principal, staff, lead, engineer,
                    developer, scientist, intern, internship, nurse, driver, technician]
    employer_type_not: [agency]           # no staffing / recruiting agencies
    posted_at_max_age_days: 45
    max_ghost_score: 60                   # skip likely "ghost" postings
    job_country_code_or: [US, CA]
  searches:                 # pages x 25 jobs each
    - name: NYC business ops / strategy
      pages: 14
      metro_code_or: ["35620"]
      job_title_or: [business operations, bizops, strategy & operations, strategy and operations, operations associate,
                     strategy associate, founders associate, founder's associate, chief of staff, deployment strategist,
                     implementation specialist, implementation strategist, ai operations, revenue operations associate,
                     operations analyst, strategy analyst, growth operations, special projects]
    - name: NYC real estate / hospitality
      pages: 8
      metro_code_or: ["35620"]
      job_title_or: [real estate, acquisitions analyst, acquisitions associate, asset management, development associate,
                     development analyst, proptech, hospitality, hotel, revenue management, investment analyst real estate]
    - name: San Francisco business ops / strategy
      pages: 6
      metro_code_or: ["41860", "41940"]
      job_title_or: [business operations, bizops, strategy & operations, strategy and operations, operations associate,
                     strategy associate, founders associate, chief of staff, deployment strategist, implementation specialist]
    - name: Other cities business ops / strategy
      pages: 10
      metro_code_or: ["16980", "33100", "31080", "12420", "19100", "26420", "41740", "45300", "36740"]
      job_title_or: [business operations, bizops, strategy & operations, strategy and operations, operations associate,
                     strategy associate, founders associate, deployment strategist, real estate, hospitality, hotel]

adzuna:                     # Adzuna job search (free key: GitHub secrets ADZUNA_APP_ID + ADZUNA_APP_KEY)
  enabled: true
  requests_per_day: 48      # free plan allows ~250 a day; each search returns up to 50 postings (Nov 9: 24 -> 48, paced)
  pace_through_day: true    # Nov 9: spread the day's searches over 24h (fresh postings all day)
  max_days_old: 3
  first_fill_days: 30       # a search's first run looks back a month
  close_after_days_unseen: 7
  focus:                    # every day, first
    - {keywords: "business operations strategy bizops", city: "New York, NY"}
    - {keywords: "deployment strategist implementation specialist AI operations", city: "New York, NY"}
    - {keywords: "operations associate strategy associate founders associate", city: "New York, NY"}
    # Nov 9: mostly AI startups / ops / deployment; real estate & hospitality as fields within AI
    - {keywords: "chief of staff founders associate generalist", city: "New York, NY"}
    - {keywords: "AI startup operations proptech hospitality", city: "New York, NY"}
    - {keywords: "business operations strategy associate", city: "San Francisco, CA"}
    - {keywords: "deployment strategist implementation specialist AI operations", city: "San Francisco, CA"}
  keywords:                 # then rotating through your other cities
    - business operations strategy
    - operations associate strategy associate
    - deployment strategist implementation
    - chief of staff founders associate
    - AI operations associate
  cities: ["Jersey City, NJ", "Chicago, IL", "Miami, FL", "Los Angeles, CA", "San Diego, CA", "Austin, TX",
           "Dallas, TX", "Houston, TX", "Tampa, FL", "Orlando, FL"]

coresignal:                 # LinkedIn postings via Coresignal (free credits, never renew; key: CORESIGNAL_API_KEY)
  enabled: true
  searches_per_day: 8       # about half a credit each
  collects_per_day: 25      # one credit per full posting, only never-seen ones (Nov 10: 25 to clear the first backlog; ~2 months of credits)
  pace_through_day: false   # Nov 11: fetch the day's 25 as soon as the day starts (backlog first)
  first_fill_days: 14       # a search's first run looks back two weeks (Mogul, VectorShift: posted Nov 3)
  window_days: 3
  close_after_days_unseen: 21
  focus_cities: ["New York"]          # every day, first
  cities: ["Chicago", "San Francisco", "Miami", "Toronto", "Los Angeles", "Austin"]
  titles: [deployment strategist, business operations, chief of staff, founder's associate, founders associate,
           operations associate, implementation specialist, product operations, strategy and operations,
           generalist, forward deployed, ai operations]

jsearch:                    # Google for Jobs via JSearch (OpenWeb Ninja) — key: JSEARCH_API_KEY
  enabled: true
  requests_per_day: 6       # free plan = 200/month. Pro ($25, 10,000/month) → set to 300
  pace_through_day: true    # Nov 9: spread the day's searches over 24h (fresh postings all day)
  # Nov 9: your best searches run EVERY day (past 3 days); what's left of the budget rotates
  # through keyword x city pairs below
  focus:
    - {keywords: "business operations OR strategy and operations OR bizops", city: "New York, NY"}
    - {keywords: "deployment strategist OR implementation specialist OR AI operations OR founding operations", city: "New York, NY"}
    - {keywords: "operations associate OR strategy associate OR founders associate", city: "New York, NY"}
    - {keywords: "chief of staff OR founders associate OR generalist", city: "New York, NY"}
  keywords:                 # your fields (Nov 8): hospitality, real estate, business ops / strategy, AI in those
    - business operations OR strategy and operations
    - operations associate OR strategy associate
    - real estate OR proptech
    - chief of staff OR founders associate
    - hospitality OR hotel
    - deployment strategist OR implementation specialist
    - proptech OR real estate technology OR AI real estate
    - hospitality technology OR travel tech OR AI hospitality
    - new grad OR rotational program OR leadership development program
  cities:                   # one per area in criteria location tiers (search radius covers suburbs)
    - {query: "New York, NY", country: us}
    - {query: "Jersey City, NJ", country: us}
    - {query: "Chicago, IL", country: us}
    - {query: "Miami, FL", country: us}
    - {query: "Tampa, FL", country: us}
    - {query: "Orlando, FL", country: us}
    - {query: "San Francisco, CA", country: us}
    - {query: "Los Angeles, CA", country: us}
    - {query: "San Diego, CA", country: us}
    - {query: "Toronto, ON", country: ca}
    - {query: "Austin, TX", country: us}
    - {query: "Dallas, TX", country: us}
    - {query: "Houston, TX", country: us}
    - {query: "Vancouver, BC", country: ca}
  first_fill_window: month  # date_posted for a pair's first search
  window: 3days             # afterwards, only recent postings
  close_after_days_unseen: 7

boards:                     # how often each kind of company board is polled (default: every run, hourly)
  # Nov 9: whole boards that are almost all hotel-floor / leasing jobs - not read; their corporate
  # roles still come in through Google Jobs / Adzuna searches
  never_watch: [Hilton, Marriott International, Greystar, Cushman & Wakefield, Expedia Group]
  every_hours:
    oracle: 12              # same for Oracle career sites
    workday: 12             # large career sites, details fetched only for postings that could pass
  quiet_after_days: 3       # a board with no passing posting for this long...
  quiet_every_hours: 12     # ...is polled this often instead (it speeds up again when one passes)

hackernews:                 # "Ask HN: Who is hiring?" — discovery only (board links in posts about your cities)
  enabled: true
  threads: 3                # this month's thread and the two before
  every_hours: 24

yc:                         # YC's public company directory - discovery only: job boards of YC startups hiring in your cities
  enabled: true
  every_hours: 24
  max_new_boards_per_run: 5000 # board guesses checked per run (each guess is re-checked once a month)

newgrad_lists:              # community new-grad lists on GitHub — discovery only (boards behind listings in your cities)
  enabled: true
  every_hours: 24
  max_new_boards_per_run: 60   # spreads the first big batch over a few days so runs stay short
  urls:
    - https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json
