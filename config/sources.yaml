# Where postings come from, besides the company boards in watchlist.yaml.
# These are settings, not rules — criteria.yaml still decides what you see.

muse:                       # The Muse public API (free key: GitHub secret MUSE_API_KEY)
  # anonymous requests are blocked since Nov 8 (Cloudflare), so it runs only with your key
  enabled: true
  needs_key: true
  levels: [Entry Level]     # Muse's own level filter; criteria rules still apply after
  every_hours: 20           # full sweep about once a day (results can't be sorted by date)
  max_pages: 120
  max_age_days: 30          # skip postings published longer ago than this (stale listings)

discovery:                  # companies found by search → their own job board joins the hourly watch
  enabled: true
  max_new_companies_per_run: 40
  retry_unfound_after_days: 30

adzuna:                     # Adzuna job search (free key: GitHub secrets ADZUNA_APP_ID + ADZUNA_APP_KEY)
  enabled: true
  requests_per_day: 24      # free plan allows ~250 a day; each search returns up to 50 postings
  max_days_old: 3
  first_fill_days: 30       # a search's first run looks back a month
  close_after_days_unseen: 7
  focus:                    # every day, first
    - {keywords: "business operations strategy bizops", city: "New York, NY"}
    - {keywords: "deployment strategist implementation specialist AI operations", city: "New York, NY"}
    - {keywords: "operations associate strategy associate founders associate", city: "New York, NY"}
    - {keywords: "real estate proptech asset management acquisitions", city: "New York, NY"}
    - {keywords: "hospitality hotel travel revenue management", city: "New York, NY"}
    - {keywords: "business operations strategy associate", city: "San Francisco, CA"}
  keywords:                 # then rotating through your other cities
    - business operations strategy
    - operations associate strategy associate
    - real estate proptech
    - hospitality hotel
    - deployment strategist implementation
  cities: ["Jersey City, NJ", "Chicago, IL", "Miami, FL", "Los Angeles, CA", "San Diego, CA", "Austin, TX",
           "Dallas, TX", "Houston, TX", "Tampa, FL", "Orlando, FL"]

jsearch:                    # Google for Jobs via JSearch (OpenWeb Ninja) — key: JSEARCH_API_KEY
  enabled: true
  requests_per_day: 6       # free plan = 200/month. Pro ($25, 10,000/month) → set to 300
  # Nov 9: your best searches run EVERY day (past 3 days); what's left of the budget rotates
  # through keyword x city pairs below
  focus:
    - {keywords: "business operations OR strategy and operations OR bizops", city: "New York, NY"}
    - {keywords: "deployment strategist OR implementation specialist OR AI operations OR founding operations", city: "New York, NY"}
    - {keywords: "operations associate OR strategy associate OR founders associate", city: "New York, NY"}
    - {keywords: "real estate OR proptech OR hospitality OR hotel", city: "New York, NY"}
  keywords:                 # your fields (Nov 8): hospitality, real estate, business ops / strategy, AI in those
    - business operations OR strategy and operations
    - operations associate OR strategy associate
    - real estate OR proptech
    - real estate analyst OR acquisitions analyst OR asset management analyst
    - hospitality OR hotel
    - revenue management OR hotel operations
    - proptech OR real estate technology OR AI real estate
    - hospitality technology OR travel tech OR AI hospitality
    - new grad OR rotational program OR leadership development program
  cities:                   # one per area in criteria location tiers (search radius covers suburbs)
    - {query: "New York, NY", country: us}
    - {query: "Jersey City, NJ", country: us}
    - {query: "Chicago, IL", country: us}
    - {query: "Miami, FL", country: us}
    - {query: "Tampa, FL", country: us}
    - {query: "Orlando, FL", country: us}
    - {query: "San Francisco, CA", country: us}
    - {query: "Los Angeles, CA", country: us}
    - {query: "San Diego, CA", country: us}
    - {query: "Toronto, ON", country: ca}
    - {query: "Austin, TX", country: us}
    - {query: "Dallas, TX", country: us}
    - {query: "Houston, TX", country: us}
    - {query: "Vancouver, BC", country: ca}
  first_fill_window: month  # date_posted for a pair's first search
  window: 3days             # afterwards, only recent postings
  close_after_days_unseen: 7

boards:                     # how often each kind of company board is polled (default: every run, hourly)
  every_hours:
    oracle: 6               # same for Oracle career sites
    workday: 6              # large career sites, details fetched only for postings that could pass
  quiet_after_days: 3       # a board with no passing posting for this long...
  quiet_every_hours: 6      # ...is polled this often instead (it speeds up again when one passes)

hackernews:                 # "Ask HN: Who is hiring?" — discovery only (board links in posts about your cities)
  enabled: true
  threads: 3                # this month's thread and the two before
  every_hours: 24

yc:                         # YC's public company directory - discovery only: job boards of YC startups hiring in your cities
  enabled: true
  every_hours: 24
  max_new_boards_per_run: 5000 # board guesses checked per run (each guess is re-checked once a month)

newgrad_lists:              # community new-grad lists on GitHub — discovery only (boards behind listings in your cities)
  enabled: true
  every_hours: 24
  max_new_boards_per_run: 60   # spreads the first big batch over a few days so runs stay short
  urls:
    - https://raw.githubusercontent.com/SimplifyJobs/New-Grad-Positions/dev/.github/scripts/listings.json
