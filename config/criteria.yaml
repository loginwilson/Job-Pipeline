# ─────────────────────────────────────────────────────────────
# Job Pipeline Criteria — Login Wilson
# Version 2.0 · 2026-11-07
#
# v2: MUST-HAVES ONLY. The pipeline collects every posting it can find and
# drops only the ones Login could not or would not take. It does not score
# or rank by preference. Everything that passes lands in the Sheet with the
# facts needed to decide, and Login buckets each one himself:
#     Veto    — not for me
#     Apply   — a real option, standard application
#     All-in  — I want this; strong application + networking
#
# Each rule below is a DROP rule unless it says "flag". A flag never removes
# a posting; it adds a note in the Flags column.
# ─────────────────────────────────────────────────────────────

candidate:
  citizenship: Canada
  degree: BS Hospitality, Travel & Tourism Management (concentration Hotel Real Estate Finance & Development), NYU
  graduation: 2027-05
  # OPT must start within 60 days of graduation, so the job should start
  # between graduation and this date. Later stated starts are flagged, not dropped.
  latest_preferred_start: 2027-08-01
  # degree fields Login has (or that clearly cover him) — used by the credentials rule
  degree_fields: [business, finance, real estate, hospitality, hotel, tourism, travel, management]


# 1 ── EMPLOYMENT TYPE ─────────────────────────────────────────
employment_type:
  allow: [full_time]
  drop: [part_time, contract, temp, contract_to_hire, internship, co_op, apprenticeship, fellowship_under_6_months]


# 2 ── LOCATION ────────────────────────────────────────────────
# Tiers only order the list; any listed city passes. Anywhere else drops.
location:
  drop_fully_remote: true        # "NYC or Remote" counts as NYC; solely remote drops
  remote_with_city_flag: "Remote role — lists your city"   # board says Remote but names one of your cities
  multi_location: use_best_listed_office_tier
  tiers:
    1:
      NYC: [Manhattan, Brooklyn, Queens, Bronx, Staten Island, Jersey City, Hoboken]
    2:
      Chicago: [Chicago, Evanston, Oak Park]
      Florida: [Miami, Miami Beach, Fort Lauderdale, West Palm Beach, Boca Raton, Tampa, Orlando]
      California: [San Francisco, Oakland, Palo Alto, Mountain View, Menlo Park, Redwood City, San Mateo, Sunnyvale, San Jose, Los Angeles, Santa Monica, Culver City, San Diego]
      Toronto: [Toronto, Mississauga, Markham, Vaughan, Oakville]
    3:
      Texas: [Austin, Dallas, Houston]
      British Columbia: [Vancouver, Burnaby, Richmond, Surrey]


# 3 ── SALARY ──────────────────────────────────────────────────
# Tested on the midpoint of the posted range (the target city's range when
# ranges are listed by city). Hourly x 2080.
#   midpoint >= comfortable        → passes
#   floor <= midpoint < comfortable → kept, flag "Low base — check incentives"
#                                     (Login judges whether equity / bonus /
#                                      commission / IPO upside is strong enough)
#   midpoint < floor               → dropped
#   no salary posted               → kept, flag "Salary unknown"
salary:
  hourly_to_annual_hours: 2080
  markets:
    US: {currency: USD, comfortable: 120000, floor: 100000}
    CA: {currency: CAD, comfortable: 140000, floor: 120000}
  # OTE / commission is never treated as base. An OTE-only posting is kept as
  # "Salary unknown (OTE only)" — commission on top of base is an incentive.
  never_count_as_base: [OTE, on-target earnings, commission, uncapped earnings]
  # When NO salary is posted, these roles are treated as below the floor: they
  # essentially never pay $100K. A posted salary that meets the floor always wins.
  rarely_meets_floor_titles: [retail associate, retail sales associate, store associate, sales floor associate, cashier, stock associate, stocker, warehouse, picker, packer, material handler, forklift, production associate, assembly associate, assembler, general labor, delivery driver, truck driver, CDL driver, driver helper, delivery associate, delivery helper, courier, restaurant server, food server, banquet server, server assistant, barista, bartender, cook, dishwasher, host / hostess, housekeeper, housekeeping, janitor, custodian, security officer, security guard, caregiver, home health aide, nursing assistant, call center, customer service representative, member service representative, bank teller, teller, receptionist, pharmacy technician, lab technician, laboratory technician, clinical laboratory, crew member, team member, cleaner, landscaper, mover, plant operator, machine operator, equipment operator, production operator, teleoperator, robot operator, administrative assistant, office administrator, maintenance technician]
  hourly_without_amount_is_below_floor: true   # pay basis "per hour" stated, no amount
  # shown in the Extra comp column so incentives are easy to judge
  extra_comp_signals: [equity, RSU, restricted stock, stock options, signing bonus, sign-on bonus, annual bonus, performance bonus, commission]


# 4 ── EXPERIENCE ──────────────────────────────────────────────
# Lower bound of a range counts ("2–4 years" → 2). Required OR preferred.
experience:
  drop_at_or_above: 3
  # Experience asks with no number that still mean "several years" (drop; the line is shown in Dropped)
  unstated_senior_terms: [extensive experience, significant experience, deep experience, many years of experience, several years of experience, multiple years of experience, several years experience, spent years, seasoned professional, mentor junior, mentor less experienced, mentoring junior, mentor and develop junior, train and mentor less experienced]
  pass_clean: [new grad, new graduate, entry level, early career, recent graduate, "0-1 years"]
  # headings that mark requirement sections (also used by rules 7 and 8)
  parse_sections:
    required: [minimum qualifications, basic qualifications, required qualifications, requirements, qualifications, what you'll need, what we require, what you bring, what you'll bring, what we're looking for, who you are, about you, you have, must have, skills and experience]
    preferred: [preferred qualifications, nice to have, bonus points, plus, preferred, what we value]


# 5 ── SENIORITY ───────────────────────────────────────────────
# Entry-level titles (Associate, Analyst, Coordinator, Specialist,
# Representative, Consultant I, Strategist, APM, Rotational, New Grad, Junior,
# Level I/II) pass; the 3-year rule handles the rest.
seniority:
  drop_title_terms: [senior, "sr.", sr, staff, principal, director, "head of", vp, svp, evp, avp, "vice president", chief, "executive director", leader, experienced, lateral, experienced hire]
  senior_title_in_description: true   # "Experience Owner" whose text says "the Sr Experience Owner"
  keep_titles_with: [chief of staff]   # level words inside these phrases don't count (years rule still applies)
  drop_level_numerals: [III, IV, V, "3", "4", "5"]   # "Analyst III", "Consultant 4"
  lead:
    drop_when_level: true          # "Lead Analyst", "Team Lead", "Product Lead"
    keep_phrases: [lead generation, lead gen, onboarding lead]
  manager_titles:
    keep: [associate product manager, product manager, program manager, project manager, implementation manager, customer success manager, account manager, partner manager, partnerships manager, product operations manager, assistant manager, manager in training, management trainee]
    drop_when:
      level_titles: [senior manager, engineering manager, general manager]
      title_starts_with: ["manager,", "manager -", "manager of", "manager –"]   # "Manager, Strategy" (not "Program Manager, X")
      duties_include: [direct reports, manage a team, lead a team of, people management, hire and develop]
    keep_takes_precedence: true


# 6 ── WORK AUTHORIZATION (US jobs; Canadian jobs need no visa) ────
# Year one is OPT (no employer sponsorship needed; job must relate to the
# degree). After that, TN. Only postings he can never take are dropped.
work_authorization:
  drop_terms:
    - must be a U.S. citizen
    - U.S. citizenship required
    - US citizenship required
    - U.S. citizens only
    - security clearance
    - clearance required
    - active clearance
    - Top Secret
    - TS/SCI
    - secret clearance
    - U.S. persons
    - ITAR
    - export control
  no_sponsorship:                  # flag only
    terms: [no visa sponsorship, unable to sponsor, will not sponsor, not able to sponsor, without sponsorship now or in the future, sponsorship is not available, does not sponsor]
    flag: "No H-1B sponsorship — OPT/TN likely fine"
  sponsorship_available_terms: [visa sponsorship available, we sponsor, H-1B, TN visa, OPT, CPT, international candidates]
  # Shown in the Visa column for US jobs (information, never a drop).
  tn_alignment:
    categories:
      hotel_manager:
        credential: bachelor's in hotel or restaurant management (hospitality degree is the closest match — confirm)
        employer_must_be: hotel or lodging facility (owner, operator, or hotel company)
        duties_signal: [hotel operations, oversee property, budgets, P&L, guest satisfaction, staff, rooms, front office, hotel general manager track]
        unclear: hotel asset management, revenue management and corporate roles — not clearly covered; flag "verify"
        excluded: restaurant manager roles
      management_consultant:
        credential: any bachelor's degree
        duties_signal: [advisory, recommendations, client engagements, project-based, consulting]
        caution: most scrutinized TN category — in-house roles relabeled as consulting get denied
    scoring: {}
    timing_rule:
      us_role_starting_before_graduation: flag "TN not available before degree — needs other work authorization"


# 7 ── TECHNICAL ───────────────────────────────────────────────
# Engineer/developer titles drop, except titles that are usually built on
# AI / no-code tools. Those (and every other posting) then drop only if a
# REQUIRED line demands coding with no non-coding alternative on that line.
technical:
  drop_titles: [engineer, engineering, developer, data scientist, machine learning, ml engineer, architect, devops, sre, programmer]
  keep_titles: [gtm engineer, go to market engineer, solutions engineer, sales engineer, prompt engineer, solutions engineering, sales engineering]
  required_drop:
    languages: [Python, JavaScript, TypeScript, Java, C++, C#, Ruby, Scala, Rust, Kotlin, Swift, Golang, PHP]
    phrases: [production code, production-quality code, write code, writing code, coding experience, programming experience, software development experience, software engineering experience, years of software engineering, build and train machine learning models, train machine learning models, building machine learning models, training ML models, building ML models]
  # if any of these appears on the same line, the line offers a non-coding path → keep
  ok_alternatives: [SQL, Excel, spreadsheets, Tableau, Power BI, Looker, no-code, low-code, Zapier, n8n, Clay, Airtable, AI tools, ChatGPT, LLMs, statistical packages, or equivalent]


# 8 ── CREDENTIALS ─────────────────────────────────────────────
# A REQUIRED line that demands a credential Login doesn't have drops the
# posting — unless the same line also accepts a bachelor's / his field /
# "or equivalent", or calls it preferred.
credentials:
  drop_title_terms: [PhD, Ph.D., MBA, JD, postdoc, postdoctoral, doctoral]   # the title itself names a degree he doesn't have
  drop_required: [MBA, JD, Juris Doctor, law degree, "Master's degree", "Masters degree", "Master of", PhD, Ph.D., doctorate, CPA, bar admission, admitted to the bar, licensed attorney, registered nurse, RN license, PE license, professional engineer]
  unrelated_degree_fields: [computer science, computer engineering, software engineering, electrical engineering, mechanical engineering, engineering, nursing, medicine, pharmacy, architecture, physics, chemistry, biology, mathematics, statistics, data science]
  softeners: [or equivalent, equivalent experience, or related experience, preferred, a plus, nice to have, any field, any discipline, not required, not necessary, not a requirement, isnt required, is not needed, dont need, do not need, no prior, not expected]


# 9 ── START DATE ──────────────────────────────────────────────
timing:
  drop_start_before_graduation: true
  drop_title_terms: [january start, winter start, spring start, january 2027, spring 2027, winter 2027, december start]   # starts before graduation / not May–Aug
  flag_start_after: "Starts after Aug 1 — check OPT timing"


# 11 ── RELATED TO YOUR DEGREE (OPT) ─────────────────────────────
# OPT year one requires the job to relate to the degree (hospitality, travel &
# tourism, hotel real estate finance & development; business roles can be
# justified). Titles from fields the degree can't support are dropped.
# TN is NOT a filter — it is shown in the Visa column for information.
opt_relatedness:
  unrelated_title_terms: [nurse, nursing, physician, doctor, surgeon, clinical, clinician, medical assistant, dental, dentist, hygienist, pharmacist, therapist, psychologist, social worker, phlebotomist, sonographer, radiology, radiologic, veterinarian, veterinary, teacher, tutor, professor, lecturer, attorney, lawyer, counsel, paralegal, legal assistant, electrician, plumber, mechanic, hvac, welder, carpenter, machinist, chemist, biologist, research scientist, lab scientist, pilot]


# 10 ── REAL, ACTIVE OPENING ─────────────────────────────────────
# Company-board postings are active while they're in the board's live feed;
# search-source postings must be recent (config/sources.yaml max_age_days)
# and, when we also watch that company's board, must be on it.
openings:
  drop_title_terms: [wildcard, wild card, apply anyway, "don't see", dont see, perfect role, right role, former founder, talent community, talent pool, talent network, general application, general interest, future opportunities, future opening, expression of interest, evergreen, open application, resume drop, submit your resume, interested in future, opportunistic application, future roles]


# ── FACTS SHOWN IN THE SHEET (never drop anything) ─────────────
fields:                     # Field column: first match wins (title, then description)
  Real Estate / Proptech: [real estate, proptech, property, properties, commercial real estate, CRE, REIT, multifamily, leasing, brokerage, mortgage, construction, housing, landlord, tenant]
  Hospitality / Travel: [hospitality, hotel, hotels, lodging, resort, travel industry, travel company, airline, tourism, restaurant, guest experience, short-term rental]
  AI / Data / Automation: [AI, artificial intelligence, machine learning, LLM, automation, data platform, analytics, SaaS, software]
  Consulting: [consulting, consultant, advisory]
  Finance: [finance, investment, investing, private equity, banking, capital markets, fintech, asset management, underwriting]

freshness:
  apply_soon_days: 7
  evergreen_after_days: 60

tracking:                   # how your Status column is followed up
  follow_up_after_days: 10  # flag "Follow up" when an application hasn't moved this long
  follow_up_statuses: [Applied, Networking]
