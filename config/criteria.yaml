# ─────────────────────────────────────────────────────────────
# Job Pipeline Criteria — Login Wilson
# Version 2.0 · 2026-11-07
#
# v2: MUST-HAVES ONLY. The pipeline collects every posting it can find and
# drops only the ones Login could not or would not take. It does not score
# or rank by preference. Everything that passes lands in the Sheet with the
# facts needed to decide, and Login buckets each one himself:
#     Veto    — not for me
#     Apply   — a real option, standard application
#     All-in  — I want this; strong application + networking
#
# Each rule below is a DROP rule unless it says "flag". A flag never removes
# a posting; it adds a note in the Flags column.
# ─────────────────────────────────────────────────────────────

candidate:
  citizenship: Canada
  degree: BS Hospitality, Travel & Tourism Management (concentration Hotel Real Estate Finance & Development), NYU
  graduation: 2027-05
  # OPT must start within 60 days of graduation, so the job should start
  # between graduation and this date. Later stated starts are flagged, not dropped.
  latest_preferred_start: 2027-08-01
  # degree fields Login has (or that clearly cover him) — used by the credentials rule
  # languages Login can work in; a REQUIRED line asking for fluency in any other language drops the posting
  languages: [English]
  degree_fields: [business, finance, real estate, hospitality, hotel, tourism, travel, hospitality management, hotel management, tourism management, business management, business administration]


# 1 ── EMPLOYMENT TYPE ─────────────────────────────────────────
employment_type:
  allow: [full_time]
  drop: [part_time, contract, temp, contract_to_hire, internship, co_op, apprenticeship, fellowship_under_6_months]


# 2 ── LOCATION ────────────────────────────────────────────────
# Tiers only order the list; any listed city passes. Anywhere else drops.
location:
  drop_fully_remote: true        # "NYC or Remote" counts as NYC; solely remote drops
  remote_with_city_flag: "Remote role — lists your city"   # board says Remote but names one of your cities
  multi_location: use_best_listed_office_tier
  tiers:
    1:
      NYC: [Manhattan, Brooklyn, Queens, Bronx, Staten Island, Jersey City, Hoboken]
    2:
      Chicago: [Chicago, Evanston, Oak Park]
      Florida: [Miami, Miami Beach, Fort Lauderdale, West Palm Beach, Boca Raton, Tampa, Orlando]
      California: [San Francisco, Oakland, Palo Alto, Mountain View, Menlo Park, Redwood City, San Mateo, Sunnyvale, San Jose, Los Angeles, Santa Monica, Culver City, San Diego]
      Toronto: [Toronto, Mississauga, Markham, Vaughan, Oakville]
    3:
      Texas: [Austin, Dallas, Houston]
      British Columbia: [Vancouver, Burnaby, Richmond, Surrey]


# 3 ── SALARY ──────────────────────────────────────────────────
# Tested on the midpoint of the posted range (the target city's range when
# ranges are listed by city). Hourly x 2080.
#   midpoint >= comfortable        → passes
#   floor <= midpoint < comfortable → kept, flag "Low base — check incentives"
#                                     (Login judges whether equity / bonus /
#                                      commission / IPO upside is strong enough)
#   midpoint < floor               → dropped
#   no salary posted               → kept, flag "Salary unknown"
salary:
  hourly_to_annual_hours: 2080
  markets:
    US: {currency: USD, comfortable: 120000, floor: 100000}
    CA: {currency: CAD, comfortable: 140000, floor: 120000}
  # OTE / commission is never treated as base. An OTE-only posting is kept as
  # "Salary unknown (OTE only)" — commission on top of base is an incentive.
  never_count_as_base: [OTE, on-target earnings, commission, uncapped earnings]
  # When NO salary is posted, these roles are treated as below the floor: they
  # essentially never pay $100K. A posted salary that meets the floor always wins.
  rarely_meets_floor_titles: [retail associate, retail sales associate, store associate, sales floor associate, cashier, stock associate, stocker, warehouse, picker, packer, material handler, forklift, production associate, assembly associate, assembler, general labor, delivery driver, truck driver, CDL driver, driver helper, delivery associate, delivery helper, courier, restaurant server, food server, banquet server, server assistant, barista, bartender, cook, dishwasher, host / hostess, housekeeper, housekeeping, janitor, custodian, security officer, security guard, caregiver, home health aide, nursing assistant, call center, customer service representative, member service representative, bank teller, teller, receptionist, pharmacy technician, lab technician, laboratory technician, clinical laboratory, crew member, team member, cleaner, landscaper, mover, plant operator, machine operator, equipment operator, production operator, teleoperator, robot operator, administrative assistant, office administrator, maintenance technician, processing assistant, loan processor, closer, mortgage processor, technician, installer, foreman, garage, clerk, hospital assistant, guest services, laboratory assistant, lab assistant, screener, cnc operator, painter, blaster, warehouser, inspector, crewperson, crew person, device driver, cajero, patient care assistant, patient support assistant, care assistant, food service, athletic aide, aide, operator, production, program assistant, operations assistant, education assistant, support assistant, audiology assistant, research assistant, assistant account executive, assistant media buyer, assistant associate, assistant analyst, assistant branch manager, driver, rideshare]
  # Store / branch jobs: a title like these PLUS store wording in the posting (no salary posted)
  # counts as below the floor. "retail" alone is not enough (software sold to retailers).
  store_roles:
    titles: [sales associate, customer service associate, customer experience associate, merchandiser, retail customer service, optical, beauty advisor, stylist, brand ambassador, key holder, keyholder]
    store_terms: [in store, our store, our stores, the store, store team, store manager, sales floor, showroom, retail store, retail location, branch, branches, merchandise, stockroom]
  hourly_without_amount_is_below_floor: true   # pay basis "per hour" stated, no amount
  # shown in the Extra comp column so incentives are easy to judge
  extra_comp_signals: [equity, RSU, restricted stock, stock options, signing bonus, sign-on bonus, annual bonus, performance bonus, commission]


# 4 ── EXPERIENCE ──────────────────────────────────────────────
# Lower bound of a range counts ("2–4 years" → 2). Required OR preferred.
experience:
  drop_at_or_above: 2   # 0–1 years only (your choice, Nov 8): a required 2+ years drops
  # Experience asks with no number that still mean "several years" (drop; the line is shown in Dropped)
  unstated_senior_terms: [extensive experience, significant experience, deep experience, many years of experience, several years of experience, multiple years of experience, several years experience, spent years, seasoned professional, mentor junior, mentor less experienced, mentoring junior, mentor and develop junior, train and mentor less experienced]
  # With NO years stated, these mid-level titles drop unless the title also has an entry cue (your choice, Nov 8)
  no_years_mid_level_titles: [manager, account executive, consultant, officer, advisor, producer, broker, executive, partner]
  entry_title_cues: [associate, assistant, junior, jr, entry, new grad, graduate, early career, analyst, coordinator, trainee, program, apprentice, " I", "1", campus, university, "2027", "2026"]
  pass_clean: [new grad, new graduate, entry level, early career, recent graduate, "0-1 years"]
  # headings that mark requirement sections (also used by rules 7 and 8)
  parse_sections:
    required: [minimum qualifications, basic qualifications, required qualifications, requirements, qualifications, what you'll need, what we require, what you bring, what you'll bring, what we're looking for, we're looking for, who you are, about you, you have, must have, skills and experience, what you need, you need, we are looking for, fit if, a fit, your background, love to meet you, who wins, what we care about, thrive if, should apply if, what it takes, we'd love to hear from you, ideal candidate, your profile, profil recherché, your skills, required skills, key skills, skills required, experience and skills, experience required, required experience, education and experience, education]
    preferred: [preferred qualifications, nice to have, bonus points, plus, preferred, what we value, sets you apart, stand out, extra credit, bonus]
    # When a posting has NO recognised requirements heading, bullets under any other heading are
    # read as requirements, except under these (duties, perks, company blurbs):
    not_requirements: [what you'll do, what you will do, what you'd do, responsibilities, responsibility, day to day, the role, about the role, your impact, impact, role, duties, mission, benefits, perks, offer, about us, about, life at, our principles, what we do, notices, how you will fulfill, examples, expect to, technologies we use, our stack]


# 5 ── SENIORITY ───────────────────────────────────────────────
# Entry-level titles (Associate, Analyst, Coordinator, Specialist,
# Representative, Consultant I, Strategist, APM, Rotational, New Grad, Junior,
# Level I/II) pass; the 3-year rule handles the rest.
seniority:
  drop_title_terms: [senior, "sr.", sr, staff, principal, director, "head of", vp, svp, evp, avp, "vice president", chief, "executive director", leader, experienced, lateral, experienced hire, FVP, SVP, RVP, first vice president, regional vice president, SMTS, senior member, distinguished, fellow engineer, supervisor, group account, group strategist, group product manager, group creative, group copy, group project manager, supv, associate partner, assoc partner, consulting partner, consult partner, dean, vice dean]
  senior_title_in_description: true   # "Experience Owner" whose text says "the Sr Experience Owner"
  keep_titles_with: [chief of staff]   # level words inside these phrases don't count (years rule still applies)
  drop_level_numerals: [III, IV, V, "3", "4", "5"]   # "Analyst III", "Consultant 4"
  lead:
    drop_when_level: true          # "Lead Analyst", "Team Lead", "Product Lead"
    keep_phrases: [lead generation, lead gen, onboarding lead]
  manager_titles:
    keep: [associate product manager, product manager, program manager, project manager, implementation manager, customer success manager, account manager, partner manager, partnerships manager, product operations manager, assistant manager, manager in training, management trainee]
    drop_when:
      level_titles: [senior manager, engineering manager, general manager]
      title_starts_with: ["manager,", "manager -", "manager-", "manager of", "manager –", "managers,", "managers -"]   # "Manager, Strategy" (not "Program Manager, X")
      duties_include: [direct reports, manage a team, lead a team of, people management, hire and develop]
    keep_takes_precedence: true


# 6 ── WORK AUTHORIZATION (US jobs; Canadian jobs need no visa) ────
# Year one is OPT (no employer sponsorship needed; job must relate to the
# degree). After that, TN. Only postings he can never take are dropped.
work_authorization:
  drop_terms:
    - must be a U.S. citizen
    - U.S. citizenship required
    - US citizenship required
    - U.S. citizens only
    - security clearance
    - clearance required
    - active clearance
    - Top Secret
    - TS/SCI
    - secret clearance
    - U.S. persons
    - ITAR
    - export control
  no_sponsorship:                  # flag only
    terms: [no visa sponsorship, unable to sponsor, will not sponsor, not able to sponsor, without sponsorship now or in the future, sponsorship is not available, does not sponsor]
    flag: "No H-1B sponsorship — OPT/TN likely fine"
  sponsorship_available_terms: [visa sponsorship available, we sponsor, H-1B, TN visa, OPT, CPT, international candidates]
  # Shown in the Visa column for US jobs (information, never a drop).
  tn_alignment:
    categories:
      hotel_manager:
        credential: bachelor's in hotel or restaurant management (hospitality degree is the closest match — confirm)
        employer_must_be: hotel or lodging facility (owner, operator, or hotel company)
        duties_signal: [hotel operations, oversee property, budgets, P&L, guest satisfaction, staff, rooms, front office, hotel general manager track]
        unclear: hotel asset management, revenue management and corporate roles — not clearly covered; flag "verify"
        excluded: restaurant manager roles
      management_consultant:
        credential: any bachelor's degree
        duties_signal: [advisory, recommendations, client engagements, project-based, consulting]
        caution: most scrutinized TN category — in-house roles relabeled as consulting get denied
    scoring: {}
    timing_rule:
      us_role_starting_before_graduation: flag "TN not available before degree — needs other work authorization"


# 7 ── TECHNICAL ───────────────────────────────────────────────
# Engineer/developer titles drop, except titles that are usually built on
# AI / no-code tools. Those (and every other posting) then drop only if a
# REQUIRED line demands coding with no non-coding alternative on that line.
technical:
  drop_titles: [engineer, engineering, "eng.", "engr", ingénieur, ingenieur, developer, application development, software development, scientist, data scientist, machine learning, ml engineer, architect, devops, sre, programmer]
  keep_titles: []   # sales / solutions / GTM engineers used to be kept; they need a technical background (Nov 8 audit)
  required_drop:
    languages: [Python, JavaScript, TypeScript, Java, C++, C#, Ruby, Scala, Rust, Kotlin, Swift, Golang, PHP]
    phrases: [production code, production-quality code, write code, writing code, coding experience, programming experience, software development experience, software engineering experience, years of software engineering, build and train machine learning models, train machine learning models, building machine learning models, training ML models, building ML models, a technical background, strong technical background, engineering background, technical degree, video editing, graphic design experience, design portfolio, portfolio of work, Salesforce administration]
  # if any of these appears on the same line, the line offers a non-coding path → keep
  ok_alternatives: [SQL, Excel, spreadsheets, Tableau, Power BI, Looker, no-code, low-code, Zapier, n8n, Clay, Airtable, AI tools, ChatGPT, LLMs, statistical packages, or equivalent]


# 8 ── CREDENTIALS ─────────────────────────────────────────────
# A REQUIRED line that demands a credential Login doesn't have drops the
# posting — unless the same line also accepts a bachelor's / his field /
# "or equivalent", or calls it preferred.
credentials:
  drop_title_terms: [PhD, Ph.D., MBA, JD, postdoc, postdoctoral, doctoral]   # the title itself names a degree he doesn't have
  drop_required: [MBA, JD, Juris Doctor, law degree, "Master's degree", "Masters degree", "Master of", PhD, Ph.D., doctorate, CPA, bar admission, admitted to the bar, licensed attorney, registered nurse, RN license, PE license, professional engineer]
  unrelated_degree_fields: [computer science, computer engineering, software engineering, electrical engineering, mechanical engineering, engineering, nursing, medicine, pharmacy, architecture, physics, chemistry, biology, mathematics, statistics, data science, graphic design, visual communication, fine arts, industrial design, film]
  # a bachelor's in one of these is genuinely yours (finance/economics alone don't count when the line is quantitative)
  strong_degree_fields: [business, hospitality, hotel, tourism, travel, real estate, business administration, hospitality management, marketing, communications, any field, any discipline, liberal arts]
  # "degree in a quantitative field" and the like: drop unless a strong field above is also accepted
  quantitative_field_terms: [quantitative field, quantitative discipline, quantitative degree, quantitative major, technical field, technical discipline, technical degree, STEM, analytical field, engineering field, mathematical field]
  softeners: [or equivalent, equivalent experience, or related experience, preferred, a plus, nice to have, any field, any discipline, not required, not necessary, not a requirement, isnt required, is not needed, dont need, do not need, no prior, not expected]


# 9 ── START DATE ──────────────────────────────────────────────
timing:
  drop_start_before_graduation: true
  drop_title_terms: [january start, winter start, spring start, january 2027, spring 2027, winter 2027, december start, december 2026, fall 2026, winter 2026, 2026 graduates, 2026 grads, class of 2026, december graduates]   # starts before graduation / not May–Aug
  flag_start_after: "Starts after Aug 1 — check OPT timing"


# 11 ── RELATED TO YOUR DEGREE (OPT) ─────────────────────────────
# OPT year one requires the job to relate to the degree (hospitality, travel &
# tourism, hotel real estate finance & development; business roles can be
# justified). Titles from fields the degree can't support are dropped.
# TN is NOT a filter — it is shown in the Visa column for information.
opt_relatedness:
  unrelated_title_terms: [nurse, nursing, physician, doctor, surgeon, clinical, clinician, medical assistant, dental, dentist, hygienist, pharmacist, therapist, psychologist, social worker, phlebotomist, sonographer, radiology, radiologic, veterinarian, veterinary, teacher, tutor, professor, lecturer, attorney, lawyer, counsel, paralegal, legal assistant, electrician, plumber, mechanic, hvac, welder, carpenter, machinist, chemist, biologist, research scientist, lab scientist, pilot, clin, ther, cytologist, cytotechnologist, occupational therapy, RN, Rn, LPN, EMT, pharm tech, pharmacy tech, patient navigator, surgical technologist, pathologists assistant, advanced practice, nurse practitioner, physician assistant, phlebotomy]


# 10 ── REAL, ACTIVE OPENING ─────────────────────────────────────
# Company-board postings are active while they're in the board's live feed;
# search-source postings must be recent (config/sources.yaml max_age_days)
# and, when we also watch that company's board, must be on it.
openings:
  drop_title_terms: [wildcard, wild card, apply anyway, "don't see", dont see, perfect role, right role, former founder, talent community, talent pool, talent network, general application, general interest, future opportunities, future opening, expression of interest, evergreen, open application, resume drop, submit your resume, interested in future, opportunistic application, future roles, your interest, past founder]


# ── FACTS SHOWN IN THE SHEET (never drop anything) ─────────────
fields:                     # Field column (information only). The job title decides when it names a field; else the description.
  Finance: [finance, financial, wealth, wealth management, private wealth, investment, investing, investor, private equity, banking, bank, banker, capital markets, fintech, asset management, underwriting, underwriter, trading, trader, quantitative, quant, hedge fund, market maker, securities, credit, lending, loan, loans, mortgage, accounting, accountant, treasury, FP&A, portfolio, tax, audit, actuarial, risk]
  Real Estate / Proptech: [real estate, proptech, property, properties, commercial real estate, CRE, REIT, multifamily, leasing, brokerage, construction, housing, landlord, tenant]
  Hospitality / Travel: [hospitality, hotel, hotels, lodging, resort, travel industry, travel company, airline, tourism, restaurant, guest experience, short-term rental]
  AI / Data / Automation: [AI, artificial intelligence, machine learning, LLM, automation, data, analytics, analyst, SaaS, software, agent, agents]
  Consulting: [consulting, consultant, advisory, strategist, deployment strategist, forward deployed]
  Product: [product manager, product management, associate product manager, APM, product operations, program manager, technical program manager, product designer, designer]
  Sales / GTM: [sales, account executive, account manager, business development, BDR, SDR, partnerships, customer success, solutions consultant, sales engineer, GTM, go to market, revenue]
  Marketing: [marketing, brand, content, social media, growth, communications, events, community, creative]
  Operations / Strategy: [operations, strategy, chief of staff, founders office, business operations, bizops, implementation, supply chain, logistics, procurement, project manager, rotational]
  People / Recruiting: [recruiter, recruiting, talent, people, HR, human resources, sourcer, compensation]

freshness:
  apply_soon_days: 7
  evergreen_after_days: 180          # posted this long ago and still open → flag
  evergreen_flag: "Open 6+ months — may be always-open"

tracking:                   # how your Status column is followed up
  follow_up_after_days: 10  # flag "Follow up" when an application hasn't moved this long
  follow_up_statuses: [Applied, Networking]
  dropped_tab_max_rows: 1000   # the Dropped tab shows the newest drops (kept small: big tabs froze the Sheet) (all are kept in the database)

# 12 ── FIELD FIT (your choice, Nov 8) ──────────────────────────
# Keep only roles in these families (matched on the job title). Your core fields
# (hospitality/travel, real estate) win over everything; unrelated fields (banking,
# legal, accounting, insurance, HR, pure data/tech) win over the other families.
field_fit:
  core_families:          # always kept
    hospitality_travel: [hotel, hotels, hospitality, resort, resorts, travel, tourism, guest experience, guest relations, revenue management, revenue manager, rooms division, front office, food and beverage, F&B, lodging, airline, airlines, cruise, concierge, catering, venue, venues, restaurant group, timeshare, vacation ownership]
    real_estate: [real estate, property, properties, housing, leasing, multifamily, CRE, REIT, acquisitions, real estate development, land development, construction management, asset management analyst, investment sales, proptech]
  families:               # kept unless an unrelated-field term is also in the title
    # your fields (Nov 8): business operations / strategy, including AI deployment roles
    ops_strategy: [operations, business operations, bizops, strategy, strategic, chief of staff, founders office, founder's office, rotational, leadership program, leadership development, development program, management trainee, generalist, project manager, project coordinator, project associate, implementation, special projects, founder associate, founders associate, facilities, workplace operations, revenue operations, sales operations, deployment strategist, forward deployed, strategist, agent development, deal operations]
  # Turned off Nov 8 ("most things of interest are hospitality, real estate, business ops"):
  # these titles now pass only at a hospitality / real-estate company. Move a line back
  # under families: to keep that field everywhere again.
  families_off:
    sales_client: [sales, business development, BDR, SDR, account executive, account manager, account representative, account coordinator, customer success, client success, client service, client services, client relations, client experience, customer experience, relationship manager, partnerships, partner, GTM, go to market, AE, success manager]
    marketing_events: [marketing, brand, content, events, event, conferences, social media, growth, communications, public relations, PR, community, media planning, media buyer, media buying, advertising, creative, influencer, sponsorship, merchandising]
    consulting: [consultant, consulting, advisory]
  # a hospitality/travel company counts even for a generic title, when the posting's opening says so
  core_from_description_lines: 12
  # the company's own opening description puts it in your core fields: any role there counts
  # (legal / HR / tech / design / product titles still drop; finance there is your concentration)
  core_company_terms:
    hospitality_travel: [hotel, hotels, hospitality, resort, resorts, travel company, travel platform, travel industry, airline, airlines, cruise, vacation rental, vacation rentals, short-term rental, short-term rentals, guest experience, restaurants, restaurant industry]
    real_estate: [real estate, property management, property managers, multifamily, apartment communities, apartments, renters, landlords, leasing teams, proptech, commercial real estate, homebuyers, homebuilders, real estate development, REIT, construction industry, construction technology, construction tech, future of construction, revolutionizing construction, construction companies, construction teams, general contractors, the nation's builders, housing providers, housing operators]
  core_company_allows: [corporate_finance, banking_markets]
  # "Your edge" flag (listed first): one of the above plus AI in the title or opening description
  ai_terms: [AI, A.I., artificial intelligence, machine learning, LLM, LLMs, agentic, AI agents, AI agent, generative AI, GenAI, conversational AI, AI-native, AI-powered]
  unrelated_title_terms:  # drop, even when a kept-family word is also in the title
    banking_markets: [investment banking, banker, banking, financing solutions, structured finance, structured financing, securitization, securitized, origination, syndicate, syndication, leveraged finance, debt capital markets, equity capital markets, DCM, ECM, M&A, mergers and acquisitions, trader, trading, quant, quantitative, capital markets, derivatives, securities, clearing, settlement, fixed income, equities, equity research, wealth, private bank, private client, brokerage, prime brokerage, fund accounting, portfolio manager, treasury, lending, loan, credit analyst, structured products, investment services, investment operations, fund services]
    legal_compliance: [legal, counsel, paralegal, compliance, regulatory, AML, KYC, audit, auditor, risk, fraud, investigator, sanctions, privacy]
    accounting_insurance: [accounting, accountant, tax, controller, controllership, bookkeeper, payroll, accounts payable, accounts receivable, underwriter, underwriting, claims, actuarial, actuary, insurance, reinsurance, broker]
    hr_people: [talent, recruiter, recruiting, talent acquisition, sourcer, human resources, HR, people partner, people operations, compensation, benefits, HRIS, talent operations]
    corporate_finance: [financial analyst, FP&A, finance analyst, finance associate, financial planning, strategic finance, corporate finance, finance & strategy, finance and strategy]
    product: [product manager, product management, associate product manager, APM, product owner, product designer, program manager]
    design: [designer, graphic design, art director, illustrator, animator, video editor, videographer, photographer, UX, UI, motion design]
    tech: [IT, information technology, help desk, desktop support, security, cybersecurity, network, systems administrator, salesforce administrator, salesforce consultant, servicenow, workday, sap, dynamics 365, crm consultant, technical support, solutions architect, hardware, firmware, manufacturing, production, warehouse, big data, sales engineer, solutions engineer, GTM engineer, go to market engineer, sales engineering, solutions engineering, engineer]
  data_title_terms: [data analyst, data analytics, data science, data engineer, business intelligence, BI, analytics engineer, data operations, data partnerships, data labeling]   # dropped unless a kept family is also in the title


# ── SPECIALIST JOBS (reads the whole description) ──────────────
# A posting that uses this many DIFFERENT terms below anywhere in its text is a
# quant / engineering / research job, whatever the title says (e.g. a Goldman
# "Research Associate" asking for backtests, asset pricing and machine learning).
specialist_text:
  drop_at: 4
  terms: [backtest, backtests, backtesting, asset pricing, stochastic, econometric, econometrics, time series, machine learning, deep learning, neural network, statistical modeling, statistical models, quantitative research, quantitative models, quantitative financial models, systematic strategies, systematic investment, derivatives pricing, monte carlo, optimization techniques, linear algebra, calculus, Matlab, C++, Python, R programming, PyTorch, TensorFlow, Kubernetes, distributed systems, microservices, data structures, algorithms, computer science, software engineering, CI/CD, API development, PhD, peer-reviewed, publications, OTC derivatives, derivatives, market making, market maker, liquidity provision, sales & trading, Series 7, Series 63, SIE, hedge fund, hedge funds, crypto markets, capital markets]

# ── OTHER LANGUAGES ────────────────────────────────────────────
# A required line asking for fluency in a language not in candidate.languages drops the posting.
other_languages: [Mandarin, Chinese, Cantonese, Japanese, Korean, Spanish, Portuguese, French, German, Italian, Arabic, Hindi, Russian, Vietnamese, Thai, Tagalog, Hebrew, Turkish, Dutch, Polish, Indonesian, Malay, Swedish, Norwegian, Danish, Finnish, Greek, Czech, Ukrainian, Farsi, Urdu, Bengali, Punjabi, Tamil]

# A posting with fewer words of description than this can't be checked (e.g. just a careers link): dropped.
description_min_words: 40

# Banking / markets vocabulary in the whole description (JPMorgan's "Strategic Financing
# Solutions – Associate": sales and trading, ABS, securitizations, rating agencies...).
# Skipped for hospitality / real-estate jobs: real-estate finance uses the same words.
banking_text:
  drop_at: 4
  terms: [sales and trading, sales & trading, capital markets, securitization, securitizations, ABS, CLO, CLOs, syndicated, syndication, rating agencies, trading desks, trading desk, front office, principal risk, structuring, origination, leveraged finance, investment banking, global markets, fixed income, derivatives, prime brokerage, equity research, pitch books, pitchbooks, Series 79, Series 7, Series 63, Series 24]

# Banking jobs on real assets come back as "Stretch: banking × real assets" instead of
# dropping (your choice, Nov 8: probably a reach, still worth applying - e.g. JPMorgan
# Strategic Financing Solutions: digital infrastructure ABS, whole business securitizations).
stretch_banking:
  min_terms: 2           # distinct real-asset terms in the description
  real_asset_terms: [real estate, commercial real estate, CRE, CMBS, RMBS, REIT, REITs, real assets, infrastructure, digital infrastructure, data centers, data center, cell towers, towers, fiber, project finance, hospitality, hotel, hotels, lodging, franchise, franchises, franchisors, whole business securitization, whole business securitizations, property, properties, multifamily, housing, land, single-family rental, net lease]
  # a banking title with one of these is read in full before it is dropped
  title_hints: [financing, finance, structured, securitization, securitized, ABS, CMBS, real estate, infrastructure, project finance, solutions, origination, lending, credit]
  # never a stretch: trading, research, wealth / private-client and brokerage-sales titles
  never_titles: [trader, trading, quant, quantitative, equity research, research analyst, wealth, private bank, private client, prime brokerage, sales and trading, sales & trading]
