# Companies polled every run — chosen by the owner. The pipeline does not pick
# companies; it judges every posting from these boards against criteria.yaml.
#
# To add one:  name, platform (greenhouse / lever / ashby), slug (from the board URL,
# e.g. jobs.lever.co/<slug>, boards.greenhouse.io/<slug>, jobs.ashbyhq.com/<slug>).
# Optional fields, only if you want the matching criteria rules to apply:
#   sectors: [...]        e.g. consulting / accounting / big 4 (Manager-title rule),
#                         hotel company / lodging (TN Hotel Manager employer test)
#   defense_primary: true drop all postings (criteria exclusions.government_defense)
#   headcount / stage     criteria company.drop_if
- name: Palantir
  platform: lever
  slug: palantir
- name: WithCoverage
  platform: greenhouse
  slug: withcoverage
